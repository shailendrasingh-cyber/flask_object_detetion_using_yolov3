<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Powered Object Detection</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4361ee;
      --secondary: #3a0ca3;
      --accent: #f72585;
      --light: #f8f9fa;
      --dark: #212529;
      --success: #4cc9f0;
      --gray: #6c757d;
      --light-gray: #e9ecef;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: var(--dark);
      line-height: 1.6;
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    
    header {
      background: linear-gradient(to right, var(--primary), var(--secondary));
      color: white;
      padding: 25px;
      text-align: center;
      position: relative;
    }
    
    .logo {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    
    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }
    
    .tagline {
      font-style: italic;
      opacity: 0.9;
    }
    
    .powered-by {
      position: absolute;
      bottom: 10px;
      right: 20px;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.2);
      padding: 5px 10px;
      border-radius: 20px;
    }
    
    .main-content {
      display: flex;
      flex-wrap: wrap;
      padding: 30px;
      gap: 30px;
    }
    
    .upload-section {
      flex: 1;
      min-width: 300px;
    }
    
    .results-section {
      flex: 2;
      min-width: 300px;
    }
    
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      padding: 25px;
      margin-bottom: 25px;
      border: 1px solid var(--light-gray);
    }
    
    h2 {
      color: var(--secondary);
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--light-gray);
    }
    
    h3 {
      color: var(--primary);
      margin: 20px 0 15px;
    }
    
    .upload-area {
      border: 2px dashed var(--gray);
      border-radius: 10px;
      padding: 30px;
      text-align: center;
      transition: all 0.3s;
      background: var(--light);
      cursor: pointer;
    }
    
    .upload-area:hover {
      border-color: var(--primary);
      background: rgba(67, 97, 238, 0.05);
    }
    
    .upload-icon {
      font-size: 3rem;
      color: var(--gray);
      margin-bottom: 15px;
    }
    
    .upload-area:hover .upload-icon {
      color: var(--primary);
    }
    
    .file-input {
      display: none;
    }
    
    .btn {
      display: inline-block;
      background: linear-gradient(to right, var(--primary), var(--secondary));
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s;
      box-shadow: 0 4px 10px rgba(67, 97, 238, 0.3);
      margin-top: 20px;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(67, 97, 238, 0.4);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .btn i {
      margin-right: 8px;
    }
    
    .status {
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      text-align: center;
      font-weight: 500;
    }
    
    .processing {
      background: rgba(76, 201, 240, 0.2);
      color: var(--secondary);
    }
    
    .complete {
      background: rgba(76, 201, 240, 0.2);
      color: var(--success);
    }
    
    .error {
      background: rgba(247, 37, 133, 0.2);
      color: var(--accent);
    }
    
    .result-img {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      display: none;
      margin-top: 15px;
    }
    
    .detections {
      list-style: none;
      margin-top: 20px;
    }
    
    .detections li {
      background: var(--light);
      margin-bottom: 10px;
      padding: 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s;
    }
    
    .detections li:hover {
      transform: translateX(5px);
    }
    
    .label {
      font-weight: 600;
      color: var(--secondary);
    }
    
    .confidence {
      background: var(--success);
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
    }
    
    footer {
      text-align: center;
      padding: 20px;
      background: var(--light);
      color: var(--gray);
      font-size: 0.9rem;
    }
    
    @media (max-width: 768px) {
      .main-content {
        flex-direction: column;
      }
      
      header {
        padding: 20px 15px;
      }
      
      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <i class="fas fa-eye"></i>
      </div>
      <h1>AI Object Detection</h1>
      <p class="tagline">Powered by YOLOv3 neural network technology</p>
      <div class="powered-by">
        <i class="fas fa-brain"></i> Powered by AI-Bo8
      </div>
    </header>
    
    <div class="main-content">
      <div class="upload-section">
        <div class="card">
          <h2>Upload Image</h2>
          <label for="fileInput" class="upload-area">
            <div class="upload-icon">
              <i class="fas fa-cloud-upload-alt"></i>
            </div>
            <p>Click or drag an image to upload</p>
            <p class="small">Supported formats: JPG, PNG, WebP</p>
          </label>
          <input type="file" id="fileInput" accept="image/*" class="file-input">
          
          <button id="detectBtn" class="btn">
            <i class="fas fa-search"></i> Detect Objects
          </button>
        </div>
        
        <div id="status" class="status"></div>
      </div>
      
      <div class="results-section">
        <div class="card">
          <h2>Detection Results</h2>
          
          <h3>Processed Image:</h3>
          <img id="resultImg" class="result-img">
          
          <h3>Detected Objects:</h3>
          <ul id="detections" class="detections"></ul>
        </div>
      </div>
    </div>
    
    <footer>
      <p>© 2023 AI Object Detection | Powered by YOLOv3 and AI-Bo8</p>
    </footer>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const detectBtn = document.getElementById('detectBtn');
    const status = document.getElementById('status');
    const resultImg = document.getElementById('resultImg');
    const detectionsList = document.getElementById('detections');
    const uploadArea = document.querySelector('.upload-area');

    // Upload area click handler
    uploadArea.addEventListener('click', () => {
      fileInput.click();
    });

    // Drag and drop functionality
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = 'var(--primary)';
      uploadArea.style.backgroundColor = 'rgba(67, 97, 238, 0.1)';
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.style.borderColor = 'var(--gray)';
      uploadArea.style.backgroundColor = 'var(--light)';
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = 'var(--gray)';
      uploadArea.style.backgroundColor = 'var(--light)';
      
      if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        status.textContent = "File selected: " + e.dataTransfer.files[0].name;
        status.className = "status complete";
      }
    });

    // File input change handler
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) {
        status.textContent = "File selected: " + fileInput.files[0].name;
        status.className = "status complete";
      }
    });

    // Detect button click handler
    detectBtn.addEventListener('click', async () => {
      if (!fileInput.files[0]) {
        status.textContent = "Please select an image first";
        status.className = "status error";
        return;
      }

      const formData = new FormData();
      formData.append("image", fileInput.files[0]);

      status.textContent = "Processing image...";
      status.className = "status processing";
      detectionsList.innerHTML = "";
      resultImg.style.display = "none";

      try {
        const response = await fetch("http://localhost:8000/predict", {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (data.error) {
          status.textContent = "Error: " + data.error;
          status.className = "status error";
          return;
        }

        status.textContent = "Detection complete!";
        status.className = "status complete";
        resultImg.src = data.image_path;
        resultImg.style.display = "block";

        data.detections.forEach(det => {
          const li = document.createElement("li");
          li.innerHTML = `
            <span class="label">${det.label}</span>
            <span class="confidence">${(det.confidence*100).toFixed(2)}%</span>
          `;
          detectionsList.appendChild(li);
        });

      } catch (err) {
        status.textContent = "Request failed: " + err;
        status.className = "status error";
      }
    });
  </script>
</body>
</html>
